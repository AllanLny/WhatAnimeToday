# Configuration de base
spring.application.name=wat-backend
server.port=8080

# Configuration APIs externes (Kitsu - pas besoin de clé API)
kitsu.api.base-url=https://kitsu.io/api/edge
jikan.api.base-url=https://api.jikan.moe/v4

# Configuration du cache
app.cache.default-ttl-hours=24

# Configuration Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html