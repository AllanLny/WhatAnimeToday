version: '3.8'

services:
  db:
    image: postgres:15
    container_name: wat-db
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    mem_limit: 512m
    memswap_limit: 1g
    cpus: 0.5

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "9090:9090"
    depends_on:
      - db
    mem_limit: 256m
    cpus: 0.25

volumes:
  db-data:
